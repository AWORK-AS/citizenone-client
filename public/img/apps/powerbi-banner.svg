<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF5"/>
      <stop offset="1" stop-color="#FBEFC6"/>
    </linearGradient>
    <linearGradient id="bar" x1="400" y1="120" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9E583"/>
      <stop offset="1" stop-color="#EBBB14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- decorative soft circles -->
  <circle cx="690" cy="70" r="120" fill="#F2C811" opacity="0.12"/>
  <circle cx="120" cy="340" r="90" fill="#EBBB14" opacity="0.10"/>
  <!-- Power BI bar mark -->
  <g transform="translate(300 120)">
    <rect x="120" y="0" width="34" height="170" rx="8" fill="url(#bar)"/>
    <rect x="62" y="48" width="34" height="122" rx="8" fill="url(#bar)" opacity="0.85"/>
    <rect x="4" y="92" width="34" height="78" rx="8" fill="url(#bar)" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="400" y="340" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3B3B3B">Power BI</text>
</svg>
