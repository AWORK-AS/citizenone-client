# Every deploy to main adds its commits to the week's DRAFT release note in
# CitizenONE, where they are rewritten into plain Danish for care staff.
# A superadmin (CTO) still has to edit and approve it before customers see it,
# so this is a starting point for the note, not the note itself.
#
# Required repository secrets:
#   RELEASE_NOTE_API_URL        e.g. https://api.citizenone.dk   (no trailing slash)
#   RELEASE_NOTE_INGEST_TOKEN   same value as backend env RELEASE_NOTE_INGEST_TOKEN
name: Release notes on deploy → CitizenONE

on:
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the range between the last deploy and this one
          # can be read.
          fetch-depth: 0

      - name: Post deploy draft
        env:
          API_URL: ${{ secrets.RELEASE_NOTE_API_URL }}
          INGEST_TOKEN: ${{ secrets.RELEASE_NOTE_INGEST_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [ -z "${API_URL:-}" ] || [ -z "${INGEST_TOKEN:-}" ]; then
            echo "Missing RELEASE_NOTE_API_URL or RELEASE_NOTE_INGEST_TOKEN secret." >&2
            exit 1
          fi

          # A first push or a force push leaves no usable "before" commit to
          # measure from, so fall back to the last handful of commits.
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range_args=("${BEFORE}..${SHA}")
          else
            range_args=(--max-count=20 "${SHA}")
          fi

          # One "sha<TAB>subject" line per commit. Merge commits are left out,
          # but a merged pull request's title (the first line of the merge
          # body) is added: it often says what the change is for better than
          # its commits do. The backend merges duplicates when it rewrites.
          commits=$(git log --no-merges --pretty=format:'%H%x09%s' "${range_args[@]}"; echo)
          prs=$(git log --merges --pretty=format:'%H' "${range_args[@]}" | while read -r m; do
              t=$(git log -1 --pretty=format:'%b' "$m" | sed '/^[[:space:]]*$/d' | head -n 1)
              [ -n "$t" ] && printf '%s\t%s\n' "$m" "$t"
            done || true)

          # Drop the housekeeping that no customer will ever care about.
          lines=$(printf '%s\n%s\n' "$commits" "$prs" \
            | sed '/^[[:space:]]*$/d' \
            | grep -viE $'^[0-9a-f]+\t(chore|ci|build|style|test|refactor)(\\(|:)' \
            | grep -viE $'^[0-9a-f]+\t(merge|bump|wip|revert)\\b' || true)

          if [ -z "$lines" ]; then
            echo "Nothing customer-facing in this deploy; no draft created."
            exit 0
          fi

          filtered=$(printf '%s\n' "$lines" | cut -f2- | sed 's/^/- /')
          items=$(printf '%s\n' "$lines" | jq -R -s \
            'split("\n") | map(select(length > 0) | split("\t") | {sha: .[0], subject: (.[1:] | join("\t"))})')

          # The backend collects every deploy in a week into one draft and
          # rewrites the subjects into plain Danish; title and content are the
          # fallback it shows if that rewrite is not available.
          title="Produktopdateringer $(date -u +'%d.%m.%Y')"
          body=$(printf 'Kladde fra deploy af %s.\n\n%s\n' "$REPO_NAME" "$filtered")

          payload=$(jq -n \
            --arg title "$title" \
            --arg content "$body" \
            --arg ref "deploy-${SHA}" \
            --arg repo "$REPO_NAME" \
            --argjson items "$items" \
            '{title: $title, content: $content, external_ref: $ref, repo: $repo, items: $items}')

          # external_ref makes this idempotent: re-running the workflow for the
          # same commit adds nothing and creates nothing new.
          curl -sS -X POST "$API_URL/api/internal/release-notes" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-Release-Token: $INGEST_TOKEN" \
            --fail-with-body \
            --data "$payload"
